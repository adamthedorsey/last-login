name: Deploy to Vercel

# CI-driven deploy (Vercel CLI + token), not Vercel's git integration — so the
# quality gate runs BEFORE anything ships. Production deploys on push to main;
# also runnable by hand from the Actions tab.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a Vercel access token
#   VERCEL_ORG_ID      — your team/org id (same across your projects)
#   VERCEL_PROJECT_ID  — THIS project's id (unique per project)
#
# The app's build-time VITE_* variables are NOT duplicated here — `vercel pull`
# fetches them from the Vercel project's Environment Variables so `vercel build`
# inlines them. Deployment Protection is unaffected: this creates deployments,
# it does not change who may view them.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gate: content validation + build + tests + bundle-leak audit.
      # A red gate fails the job and nothing deploys.
      - name: Verify
        run: npm run verify

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
